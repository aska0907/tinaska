<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Patrick Hand', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

  

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 10px auto 20px;
            padding: 20px;
        }

        /* Header */
        .gallery-header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .gallery-header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Add Gallery Button */
        .add-gallery-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff6b6b, #764ba2);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 2em;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .add-gallery-btn:hover {
            transform: scale(1.1) rotate(90deg);
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        /* Gallery Item */
        .gallery-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.4s ease;
            background: white;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .gallery-media {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover .gallery-media {
            transform: scale(1.05);
        }

        .gallery-info {
            padding: 15px;
        }

        .gallery-title {
            font-family: 'Dancing Script', cursive;
            font-size: 1.3em;
            margin-bottom: 8px;
            color: #764ba2;
        }

        .gallery-description {
            color: #666;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .gallery-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            color: #888;
        }

        .gallery-author {
            font-weight: bold;
        }

        .gallery-author.albert {
            color: #667eea;
        }

        .gallery-author.tinah {
            color: #ff6b6b;
        }

        .media-type {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.9);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            color: #764ba2;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5em;
            cursor: pointer;
            color: #888;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #764ba2;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Patrick Hand', cursive;
        }

        .form-group textarea {
            height: 80px;
            resize: vertical;
        }

        .author-options {
            display: flex;
            gap: 10px;
        }

        .author-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            text-align: center;
        }

        .author-btn.active {
            border-color: #764ba2;
            background: #764ba2;
            color: white;
        }

        .media-upload {
            border: 2px dashed #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b6b, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: white;
            grid-column: 1 / -1;
        }

        /* Floating Hearts */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-hearts span {
            position: absolute;
            font-size: 20px;
            opacity: 0.2;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* NEW: Fullscreen Media Viewer */
        .media-viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .media-viewer-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .media-viewer-content img,
        .media-viewer-content video {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        .media-viewer-content audio {
            width: 80vw;
            max-width: 600px;
            margin: 20px;
        }

        .media-viewer-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        .media-viewer-close {
            position: absolute;
            top: 15px;
            right: 15px;
            color: white;
            background: rgba(0,0,0,0.5);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            cursor: pointer;
            z-index: 10;
        }

        .media-viewer-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            cursor: pointer;
            z-index: 10;
        }

        .media-viewer-prev {
            left: 20px;
        }

        .media-viewer-next {
            right: 20px;
        }

        /* NEW: Grid Layout Options */
        .gallery-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .layout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .layout-btn.active {
            background: rgba(255,255,255,0.4);
        }

        /* NEW: Different grid layouts */
        .gallery-grid.compact {
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }

        .gallery-grid.masonry {
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            grid-auto-rows: 10px;
        }

        .gallery-grid.masonry .gallery-item {
            grid-row-end: span 25;
        }

        .gallery-grid.masonry .gallery-item.tall {
            grid-row-end: span 35;
        }

        /* NEW: Filter controls */
        .filter-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: rgba(255,255,255,0.4);
        }

        /* NEW: Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
       <script src="navbar.js"></script>

    <div class="container">
        <div class="gallery-header">
            <h1>Our Love Gallery 📸</h1>
            <p>Click on any memory to view it in fullscreen</p>
        </div>

        <!-- NEW: Gallery Controls -->
        <div class="gallery-controls">
            <button class="layout-btn active" data-layout="standard">Standard</button>
            <button class="layout-btn" data-layout="compact">Compact</button>
            <button class="layout-btn" data-layout="masonry">Masonry</button>
        </div>

        <!-- NEW: Filter Controls -->
        <div class="filter-controls">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="photo">Photos</button>
            <button class="filter-btn" data-filter="video">Videos</button>
            <button class="filter-btn" data-filter="audio">Audio</button>
            <button class="filter-btn" data-filter="albert">Albert</button>
            <button class="filter-btn" data-filter="tinah">Tinah</button>
        </div>

        <div class="gallery-grid" id="galleryGrid">
            <div class="empty-state">
                <h3>No memories yet</h3>
                <p>Click the + button to add your first memory!</p>
            </div>
        </div>
    </div>

    <button class="add-gallery-btn" onclick="openGalleryModal()">+</button>

    <!-- Simple Add Memory Modal -->
    <div class="modal" id="galleryModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeGalleryModal()">×</span>
            <h2 style="text-align: center; color: #764ba2; margin-bottom: 20px;">Add Memory</h2>
            
            <form id="galleryMemoryForm">
                <div class="form-group">
                    <label>Who's adding this?</label>
                    <div class="author-options">
                        <div class="author-btn active" data-author="Albert">Albert</div>
                        <div class="author-btn" data-author="Tinah">Tinah</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="galleryDate">Date</label>
                    <input type="date" id="galleryDate" required>
                </div>

                <div class="form-group">
                    <label for="galleryDescription">Description</label>
                    <textarea id="galleryDescription" placeholder="What's this memory about?"></textarea>
                </div>

                <div class="form-group">
                    <label>Add Media</label>
                    <div class="media-upload" onclick="document.getElementById('galleryMediaFile').click()">
                        <div>📷 Click to add photo/video/audio</div>
                        <input type="file" id="galleryMediaFile" accept="image/*,video/*,audio/*" style="display: none;">
                    </div>
                    <div id="gallery-media-preview"></div>
                </div>

                <button type="submit" class="submit-btn">Save Memory</button>
            </form>
        </div>
    </div>

    <!-- NEW: Fullscreen Media Viewer -->
    <div class="media-viewer" id="mediaViewer">
        <div class="media-viewer-close" onclick="closeMediaViewer()">×</div>
        <div class="media-viewer-nav media-viewer-prev" onclick="navigateMedia(-1)">‹</div>
        <div class="media-viewer-content" id="mediaViewerContent">
            <!-- Media content will be inserted here -->
        </div>
        <div class="media-viewer-nav media-viewer-next" onclick="navigateMedia(1)">›</div>
    </div>

    <!-- Floating Hearts -->
    <div class="floating-hearts">
        <span style="left:10%; animation-delay:0s;">💖</span>
        <span style="left:20%; animation-delay:1s;">💕</span>
        <span style="left:30%; animation-delay:2s;">❤️</span>
    </div>

<script type="module">
    import { firebaseConfig } from './firebase-config.js';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';
    import { 
        getFirestore, 
        collection, 
        addDoc, 
        getDocs, 
        query, 
        orderBy,
        onSnapshot,
        serverTimestamp 
    } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';
    import { 
        getAuth, 
        onAuthStateChanged 
    } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js';
    import { 
        getStorage, 
        ref, 
        uploadBytes, 
        getDownloadURL 
    } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-storage.js';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const storage = getStorage(app);

    let allMediaItems = [];
    let currentUser = null;
    let currentAuthor = 'Albert';
    let selectedGalleryFile = null;
    let currentMediaIndex = 0;
    let currentLayout = 'standard';
    let currentFilter = 'all';
    let filteredItems = [];

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            loadGalleryMemories();
            setupGalleryControls();
        } else {
            window.location.href = 'index.html';
        }
    });

    async function loadGalleryMemories() {
        try {
            const q = query(
                collection(db, 'galleryMemories'),
                orderBy('createdAt', 'desc')
            );
            
            const querySnapshot = await getDocs(q);
            allMediaItems = querySnapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            
            updateGallery();
            setupRealtimeUpdates();
        } catch (error) {
            console.error("Error loading gallery memories: ", error);
        }
    }

    function setupRealtimeUpdates() {
        const q = query(
            collection(db, 'galleryMemories'),
            orderBy('createdAt', 'desc')
        );
        
        onSnapshot(q, (snapshot) => {
            allMediaItems = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            updateGallery();
        });
    }

    async function uploadGalleryFile(file) {
        try {
            const fileExtension = file.name.split('.').pop();
            const fileName = `gallery/${currentUser.uid}/${Date.now()}.${fileExtension}`;
            const storageRef = ref(storage, fileName);
            
            const snapshot = await uploadBytes(storageRef, file);
            const downloadURL = await getDownloadURL(snapshot.ref);
            return downloadURL;
        } catch (error) {
            console.error("Error uploading file: ", error);
            throw new Error('Failed to upload file');
        }
    }

    function openGalleryModal() {
        document.getElementById('galleryModal').style.display = 'block';
        document.getElementById('galleryDate').valueAsDate = new Date();
    }

    function closeGalleryModal() {
        document.getElementById('galleryModal').style.display = 'none';
        document.getElementById('galleryMemoryForm').reset();
        document.getElementById('gallery-media-preview').style.display = 'none';
        selectedGalleryFile = null;
        document.querySelectorAll('.author-btn')[0].click();
    }

    document.querySelectorAll('.author-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.author-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentAuthor = this.dataset.author;
        });
    });

    document.getElementById('galleryMediaFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        selectedGalleryFile = file;
        const preview = document.getElementById('gallery-media-preview');
        
        if (file) {
            preview.style.display = 'block';
            if (file.type.startsWith('image/')) {
                preview.innerHTML = `<img src="${URL.createObjectURL(file)}" style="max-width: 100%; max-height: 150px; border-radius: 10px;">`;
            } else if (file.type.startsWith('video/')) {
                preview.innerHTML = `<video controls style="max-width: 100%; max-height: 150px; border-radius: 10px;">
                    <source src="${URL.createObjectURL(file)}" type="${file.type}">
                </video>`;
            } else if (file.type.startsWith('audio/')) {
                preview.innerHTML = `<audio controls style="width: 100%; margin-top: 10px;">
                    <source src="${URL.createObjectURL(file)}" type="${file.type}">
                </audio>`;
            }
        }
    });

    document.getElementById('galleryMemoryForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = this.querySelector('.submit-btn');
        submitBtn.textContent = 'Uploading...';
        submitBtn.disabled = true;

        try {
            if (!selectedGalleryFile) {
                alert('Please select a file to upload');
                return;
            }

            const mediaUrl = await uploadGalleryFile(selectedGalleryFile);
            const mediaType = selectedGalleryFile.type;

            const memoryData = {
                author: currentAuthor,
                date: document.getElementById('galleryDate').value,
                description: document.getElementById('galleryDescription').value,
                mediaUrl: mediaUrl,
                mediaType: mediaType,
                type: mediaType.startsWith('image/') ? 'photo' : 
                      mediaType.startsWith('video/') ? 'video' : 'audio',
                createdAt: serverTimestamp()
            };

            await addDoc(collection(db, 'galleryMemories'), memoryData);
            
            closeGalleryModal();
            alert('Memory added successfully! 💕');
            
        } catch (error) {
            console.error("Error saving memory: ", error);
            alert('Error saving memory. Please try again.');
        } finally {
            submitBtn.textContent = 'Save Memory';
            submitBtn.disabled = false;
        }
    });

    function updateGallery() {
        const container = document.getElementById('galleryGrid');
        
        // Apply filter
        filteredItems = allMediaItems;
        if (currentFilter !== 'all') {
            if (['photo', 'video', 'audio'].includes(currentFilter)) {
                filteredItems = allMediaItems.filter(item => item.type === currentFilter);
            } else if (['albert', 'tinah'].includes(currentFilter)) {
                filteredItems = allMediaItems.filter(item => item.author.toLowerCase() === currentFilter);
            }
        }
        
        if (filteredItems.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>No memories found</h3>
                    <p>${allMediaItems.length === 0 ? 'Click the + button to add your first memory!' : 'Try changing your filters'}</p>
                </div>
            `;
            return;
        }

        // Apply layout
        container.className = 'gallery-grid ' + currentLayout;
        
        container.innerHTML = filteredItems.map((item, index) => {
            const formattedDate = new Date(item.date).toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });

            let mediaElement = '';
            if (item.type === 'photo') {
                mediaElement = `<img src="${item.mediaUrl}" class="gallery-media" loading="lazy">`;
            } else if (item.type === 'video') {
                mediaElement = `<video class="gallery-media">
                    <source src="${item.mediaUrl}" type="video/mp4">
                </video>`;
            } else if (item.type === 'audio') {
                mediaElement = `<div style="height: 250px; display: flex; align-items: center; justify-content: center; background: #f0f0f0;">
                    <audio controls style="width: 90%;">
                        <source src="${item.mediaUrl}" type="audio/mpeg">
                    </audio>
                </div>`;
            }

            return `
                <div class="gallery-item" onclick="openMediaViewer(${index})">
                    ${mediaElement}
                    <div class="media-type">${item.type === 'photo' ? '📷' : item.type === 'video' ? '🎥' : '🎵'}</div>
                    <div class="gallery-info">
                        <div class="gallery-description">${item.description}</div>
                        <div class="gallery-meta">
                            <span class="gallery-author ${item.author.toLowerCase()}">${item.author}</span>
                            <span class="gallery-date">${formattedDate}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Media Viewer Functions
    function openMediaViewer(index) {
        currentMediaIndex = index;
        const viewer = document.getElementById('mediaViewer');
        const content = document.getElementById('mediaViewerContent');
        
        const item = filteredItems[currentMediaIndex];
        const formattedDate = new Date(item.date).toLocaleDateString('en-US', {
            month: 'long',
            day: 'numeric',
            year: 'numeric'
        });
        
        let mediaElement = '';
        if (item.type === 'photo') {
            mediaElement = `<img src="${item.mediaUrl}">`;
        } else if (item.type === 'video') {
            mediaElement = `<video controls autoplay>
                <source src="${item.mediaUrl}" type="video/mp4">
            </video>`;
        } else if (item.type === 'audio') {
            mediaElement = `<audio controls autoplay>
                <source src="${item.mediaUrl}" type="audio/mpeg">
            </audio>`;
        }
        
        content.innerHTML = `
            ${mediaElement}
            <div class="media-viewer-info">
                <p>${item.description}</p>
                <p><strong>${item.author}</strong> • ${formattedDate}</p>
            </div>
        `;
        
        viewer.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeMediaViewer() {
        document.getElementById('mediaViewer').style.display = 'none';
        document.body.style.overflow = 'auto';
        
        const mediaElements = document.querySelectorAll('#mediaViewerContent video, #mediaViewerContent audio');
        mediaElements.forEach(media => {
            media.pause();
        });
    }

    function navigateMedia(direction) {
        currentMediaIndex = (currentMediaIndex + direction + filteredItems.length) % filteredItems.length;
        openMediaViewer(currentMediaIndex);
    }

    function setupGalleryControls() {
        document.querySelectorAll('.layout-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentLayout = this.dataset.layout;
                updateGallery();
            });
        });
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                updateGallery();
            });
        });
    }

    window.addEventListener('click', function(e) {
        const modal = document.getElementById('galleryModal');
        if (e.target === modal) closeGalleryModal();
        
        const viewer = document.getElementById('mediaViewer');
        if (e.target === viewer) closeMediaViewer();
    });

    document.addEventListener('keydown', function(e) {
        const viewer = document.getElementById('mediaViewer');
        if (viewer.style.display === 'flex') {
            if (e.key === 'Escape') {
                closeMediaViewer();
            } else if (e.key === 'ArrowLeft') {
                navigateMedia(-1);
            } else if (e.key === 'ArrowRight') {
                navigateMedia(1);
            }
        }
    });

    window.openGalleryModal = openGalleryModal;
    window.closeGalleryModal = closeGalleryModal;
    window.openMediaViewer = openMediaViewer;
    window.closeMediaViewer = closeMediaViewer;
    window.navigateMedia = navigateMedia;
</script>
</body>
</html>
