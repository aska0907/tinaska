<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Timeline</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Patrick Hand', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
       
        }
    /* Navigation */
.navbar {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  padding: 15px 20px;
  box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;
}

.nav-container {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-family: 'Dancing Script', cursive;
  font-size: 2em;
  font-weight: bold;
  color: #764ba2;
}

/* Nav Links */
.nav-links {
  display: flex;
  gap: 30px;
  transition: all 0.3s ease;
}

.nav-links a {
  text-decoration: none;
  color: #333;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: 20px;
  transition: all 0.3s ease;
  font-family: 'Patrick Hand', cursive;
}

.nav-links a:hover,
.nav-links a.active {
  background: #764ba2;
  color: white;
}

/* Hamburger Menu */
.menu-toggle {
  display: none;
  flex-direction: column;
  cursor: pointer;
  gap: 5px;
}

.menu-toggle span {
  width: 25px;
  height: 3px;
  background: #764ba2;
  border-radius: 2px;
  transition: all 0.3s ease;
}

/* Responsive Styles */
@media (max-width: 768px) {
  .menu-toggle {
    display: flex;
  }

  .nav-links {
    position: absolute;
    top: 70px;
    right: 20px;
    background: rgba(255, 255, 255, 0.98);
    flex-direction: column;
    gap: 15px;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    display: none;
  }

  .nav-links.active {
    display: flex;
  }

  .nav-links a {
    text-align: center;
  }
}

/* Animation for toggle */
.menu-toggle.active span:nth-child(1) {
  transform: rotate(45deg) translateY(8px);
}
.menu-toggle.active span:nth-child(2) {
  opacity: 0;
}
.menu-toggle.active span:nth-child(3) {
  transform: rotate(-45deg) translateY(-8px);
}


        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            margin-top: 10px;
            padding: 0 10px;
        }

        .header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5em;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Add Timeline Button */
        .add-timeline-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff6b6b, #764ba2);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 2em;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .add-timeline-btn:hover {
            transform: scale(1.1) rotate(90deg);
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 0 10px;
            position: relative;
        }

        /* Decorated timeline line */
        .timeline::before {
            content: '';
            position: absolute;
            width: 4px;
            background: linear-gradient(45deg, #ff6b6b, #ffa8a8, #ffd8d8, #ffa8a8, #ff6b6b);
            top: 0;
            bottom: 0;
            left: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }

        /* Heart decorations along the timeline */
        .timeline::after {
            content: '💕✨❤️🥰💖';
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;
            width: 30px;
            font-size: 12px;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            animation: floatHearts 3s ease-in-out infinite;
        }

        .timeline-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease forwards;
        }

        .date-marker {
            min-width: 70px;
            background: linear-gradient(135deg, #ff6b6b, #ffa8a8);
            padding: 8px 10px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(255, 107, 107, 0.3);
            font-weight: bold;
            color: white;
            font-size: 0.8em;
            position: relative;
            z-index: 2;
            font-family: 'Patrick Hand', cursive;
        }

        .timeline-content {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            position: relative;
            border-left: 3px solid #ff6b6b;
            font-family: 'Patrick Hand', cursive;
            font-size: 1.1em;
        }

        .timeline-content::before {
            content: '❤️';
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border: 2px solid #ff6b6b;
            border-radius: 50%;
            left: -32px;
            top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            box-shadow: 0 0 5px rgba(255, 107, 107, 0.5);
            animation: pulse 2s infinite;
        }

        .memory {
            color: #333;
            line-height: 1.5;
        }

        .heart {
            color: #ff6b6b;
            margin: 0 2px;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes floatHearts {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 500px;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5em;
            cursor: pointer;
            color: #888;
        }

        .close-modal:hover {
            color: #333;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #764ba2;
            font-family: 'Dancing Script', cursive;
            font-size: 1.3em;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            font-family: 'Patrick Hand', cursive;
            transition: border-color 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #764ba2;
            background: white;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b6b, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Patrick Hand', cursive;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Staggered animations */
        .timeline-item:nth-child(1) { animation-delay: 0.1s; }
        .timeline-item:nth-child(2) { animation-delay: 0.2s; }
        .timeline-item:nth-child(3) { animation-delay: 0.3s; }
        .timeline-item:nth-child(4) { animation-delay: 0.4s; }
        .timeline-item:nth-child(5) { animation-delay: 0.5s; }
        .timeline-item:nth-child(6) { animation-delay: 0.6s; }

        /* Larger screens */
        @media screen and (min-width: 500px) {
            .timeline::before {
                left: 50%;
                transform: translateX(-50%);
            }
            
            .timeline::after {
                left: calc(50% - 15px);
            }
            
            .timeline-item {
                width: 80%;
                margin: 0 auto;
            }
            
            .timeline-item:nth-child(odd) {
                flex-direction: row;
            }
            
            .timeline-item:nth-child(even) {
                flex-direction: row-reverse;
                text-align: right;
            }
            
            .timeline-item:nth-child(even) .timeline-content::before {
                left: auto;
                right: -32px;
            }
            
            .timeline-item:nth-child(even) .timeline-content {
                border-left: none;
                border-right: 3px solid #ff6b6b;
            }
            
            .timeline-content::before {
                left: -32px;
            }

            .header h1 {
                font-size: 3.5em;
            }
        }

        /* Additional floating hearts in background */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-hearts span {
            position: absolute;
            font-size: 20px;
            opacity: 0.3;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .empty-state h3 {
            font-family: 'Dancing Script', cursive;
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        /* Small screens: prevent timeline cards from exceeding viewport */
        @media screen and (max-width: 499px) {
            .timeline {
                padding-left: 18px;
            }

            /* move the vertical line closer to the content but not overlapping */
            .timeline::before {
                left: 36px; /* shifted right */
            }

            .timeline::after {
                left: 28px;
            }

            .timeline-item {
                width: auto;
                margin: 0 8px 20px 64px; /* account for the moved line */
                flex-direction: column !important;
                align-items: stretch;
            }

            .timeline-item .date-marker {
                align-self: flex-start;
                min-width: 50px;
                font-size: 0.85em;
                margin-bottom: 8px;
                margin-left: -8px; /* nudge date marker a bit toward the line */
            }

            .timeline-content {
                border-left: none;
                border-right: none;
                padding: 12px;
                font-size: 1em;
                overflow-wrap: anywhere; /* ensure long words or URLs wrap */
                word-break: break-word;
            }

            .timeline-content::before {
                left: -40px; /* move the heart marker so it sits near the vertical line */
                right: auto;
                top: 12px;
            }

            /* ensure modal and buttons fit on tiny screens */
            .modal-content {
                width: 95%;
                padding: 20px;
            }

            .add-timeline-btn {
                right: 18px;
                bottom: 20px;
                width: 56px;
                height: 56px;
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>
        <!-- Navigation -->
   <!-- Navigation -->
  <script src="navbar.js"></script>

    <!-- Floating background hearts -->
    <div class="floating-hearts">
        <span style="left:10%; animation-delay:0s;">💖</span>
        <span style="left:20%; animation-delay:1s;">💕</span>
        <span style="left:30%; animation-delay:2s;">❤️</span>
        <span style="left:40%; animation-delay:3s;">💗</span>
        <span style="left:60%; animation-delay:4s;">💓</span>
        <span style="left:80%; animation-delay:5s;">💝</span>
        <span style="left:90%; animation-delay:6s;">✨</span>
    </div>

    <div class="container">
        <div class="header">
            <h1>Our Love Timeline <span class="heart">❤️</span></h1>
            <p style="color: white;">Chronological journey of our relationship</p>
        </div>

        <div class="timeline" id="timelineContainer">
            <!-- Timeline items will be dynamically added here -->
            <div class="empty-state">
                <h3>No timeline events yet</h3>
                <p>Click the + button to add your first special moment!</p>
            </div>
        </div>
    </div>

    <!-- Add Timeline Button -->
    <button class="add-timeline-btn" onclick="openTimelineModal()">+</button>

    <!-- Add Timeline Event Modal -->
    <div class="modal" id="timelineModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeTimelineModal()">×</span>
            <h2 style="font-family: 'Dancing Script', cursive; color: #764ba2; margin-bottom: 20px; text-align: center;">Add Timeline Event</h2>
            
            <form id="timelineEventForm">
                <div class="form-group">
                    <label for="eventDate">Date</label>
                    <input type="date" id="eventDate" required>
                </div>

                <div class="form-group">
                    <label for="eventTitle">Event Title</label>
                    <input type="text" id="eventTitle" placeholder="What was this special moment?" required>
                </div>

                <div class="form-group">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" placeholder="Tell us about this beautiful memory... 💖" required></textarea>
                </div>

                <button type="submit" class="submit-btn">💾 Add to Timeline</button>
            </form>
        </div>
    </div>
<script type="module">
    // Import Firebase
    import { firebaseConfig } from './firebase-config.js';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';
    import { 
        getFirestore, 
        collection, 
        addDoc, 
        getDocs, 
        query, 
        orderBy, 
        serverTimestamp,
        onSnapshot 
    } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';
    import { 
        getAuth, 
        onAuthStateChanged 
    } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js';

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Initialize variables
    let timelineEvents = [];
    let currentUser = null;
    let currentUserName = null;
    let currentAuthor = 'albert'; // Default author

    // Check authentication state
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            
            // Wait for user data to be fully loaded
            await user.reload();
            
            // Get the displayName - handle null case
            currentUserName = user.displayName ? user.displayName.toLowerCase() : null;
            
            console.log('🔥 User logged in:', {
                email: user.email,
                displayName: user.displayName,
                currentUserName: currentUserName
            });
            
            // If displayName is still null, use fallback
            if (!currentUserName) {
                console.warn('⚠️ displayName is null, using email fallback');
                currentUserName = user.email ? (user.email.toLowerCase().includes('albert') ? 'albert' : 'tinah') : 'unknown';
                console.log('🔄 Using fallback username:', currentUserName);
            }
            
            // Set current author based on logged in user
            currentAuthor = currentUserName;
            
            loadTimelineEvents();
            setupRealtimeUpdates();
        } else {
            // Redirect to login if not authenticated
            window.location.href = 'index.html';
        }
    });

    // Load timeline events from Firebase
    async function loadTimelineEvents() {
        try {
            const q = query(
                collection(db, 'timelineEvents'),
                orderBy('date', 'asc')
            );
            
            const querySnapshot = await getDocs(q);
            timelineEvents = querySnapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            
            console.log('📝 Loaded timeline events:', timelineEvents);
            updateTimeline();
        } catch (error) {
            console.error("Error loading timeline events: ", error);
            alert('Error loading timeline. Please refresh the page.');
        }
    }

    // Set up real-time updates
    function setupRealtimeUpdates() {
        const q = query(
            collection(db, 'timelineEvents'),
            orderBy('date', 'asc')
        );
        
        onSnapshot(q, (snapshot) => {
            timelineEvents = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            updateTimeline();
        });
    }

    // Modal Functions
    function openTimelineModal() {
        document.getElementById('timelineModal').style.display = 'block';
        document.getElementById('eventDate').valueAsDate = new Date();
    }

    function closeTimelineModal() {
        document.getElementById('timelineModal').style.display = 'none';
        document.getElementById('timelineEventForm').reset();
    }

    // Form Submission - FIXED VERSION
    document.getElementById('timelineEventForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = this.querySelector('.submit-btn');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Saving...';
        submitBtn.disabled = true;

        try {
            // Get form values
            const date = document.getElementById('eventDate').value;
            const title = document.getElementById('eventTitle').value;
            const description = document.getElementById('eventDescription').value;

            // Validate required fields
            if (!date || !title || !description) {
                alert('Please fill in all required fields');
                return;
            }

            console.log('💾 Preparing to save event:', {
                date: date,
                title: title,
                description: description,
                author: currentAuthor
            });

            const eventData = {
                date: date,
                title: title,
                description: description,
                author: currentAuthor, // Use the current logged-in user as author
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            };

            console.log('💾 Saving event data:', eventData);
            
            // Save to Firebase
            const docRef = await addDoc(collection(db, 'timelineEvents'), eventData);
            console.log('✅ Event saved with ID:', docRef.id);
            
            closeTimelineModal();
            alert('Timeline event added successfully! 💕');
            
        } catch (error) {
            console.error("❌ Error saving timeline event: ", error);
            console.error("Error details:", error.message, error.code);
            alert('Error saving timeline event: ' + error.message);
        } finally {
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        }
    });

    // Update Timeline Display
    function updateTimeline() {
        console.log('🔄 Updating timeline display with events:', timelineEvents);
        
        const container = document.getElementById('timelineContainer');
        
        if (timelineEvents.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>No timeline events yet</h3>
                    <p>Click the + button to add your first special moment!</p>
                </div>
            `;
            return;
        }

        container.innerHTML = timelineEvents.map((event, index) => {
            const eventDate = new Date(event.date);
            const formattedDate = eventDate.toLocaleDateString('en-US', {
                month: 'long',
                day: 'numeric',
                year: 'numeric'
            });

            const isEven = index % 2 === 0;
            const authorClass = event.author ? event.author.toLowerCase() : '';
            
            console.log(`📄 Rendering event: ${event.title} by ${event.author}`);
            
            return `
                <div class="timeline-item" style="animation-delay: ${0.1 * (index + 1)}s">
                    <div class="date-marker">${formattedDate}</div>
                    <div class="timeline-content">
                        <div class="memory">
                            <strong>${event.title}</strong>
                            ${event.author ? `<span class="event-author ${authorClass}">- ${event.author}</span>` : ''}
                            <br>
                            ${event.description}
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        // Re-initialize intersection observer for new items
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.animationPlayState = 'running';
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.timeline-item').forEach(item => {
            observer.observe(item);
        });
    }

    // Close modal when clicking outside
    window.addEventListener('click', function(e) {
        const modal = document.getElementById('timelineModal');
        if (e.target === modal) {
            closeTimelineModal();
        }
    });

    // Make functions global for HTML onclick attributes
    window.openTimelineModal = openTimelineModal;
    window.closeTimelineModal = closeTimelineModal;
</script>
</body>
</html>
