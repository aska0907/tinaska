<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Love Diary - Sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; padding: 20px; display: grid; place-items: center; overflow: hidden; font-family: 'Patrick Hand', cursive; background: linear-gradient(135deg, #667eea, #764ba2); }
    .login-container { position: relative; z-index: 1; width: min(100%, 450px); padding: 48px; text-align: center; border: 3px solid rgba(255,255,255,.3); border-radius: 25px; background: rgba(255,255,255,.95); box-shadow: 0 15px 35px rgba(0,0,0,.2); backdrop-filter: blur(10px); }
    .logo { margin-bottom: 10px; color: #764ba2; font-family: 'Dancing Script', cursive; font-size: clamp(2.8rem, 9vw, 3.5rem); }
    .subtitle, .access-note { color: #666; font-size: 1.15rem; }
    .subtitle { margin-bottom: 32px; }
    .access-note { margin-top: 20px; line-height: 1.4; }
    .form-group { margin-bottom: 22px; text-align: left; }
    label { display: block; margin-bottom: 8px; color: #764ba2; font-size: 1.1rem; font-weight: bold; }
    input { width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 15px; background: #fafafa; font: 1.1rem 'Patrick Hand', cursive; }
    input:focus { outline: none; border-color: #764ba2; background: #fff; box-shadow: 0 5px 15px rgba(0,0,0,.1); }
    .login-btn { width: 100%; padding: 18px; border: 0; border-radius: 15px; cursor: pointer; color: #fff; background: linear-gradient(135deg, #ff6b6b, #764ba2); font: bold 1.25rem 'Patrick Hand', cursive; transition: transform .2s, box-shadow .2s; }
    .login-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.2); }
    .login-btn:disabled { cursor: wait; opacity: .7; }
    .message { display: none; margin-bottom: 20px; padding: 14px; border-radius: 10px; font-weight: bold; }
    .message.success { display: block; color: #155724; border: 1px solid #c3e6cb; background: #d4edda; }
    .message.error { display: block; color: #721c24; border: 1px solid #f5c6cb; background: #f8d7da; }
    .couple-names { display: flex; justify-content: center; gap: 30px; margin-top: 20px; color: #764ba2; font-size: 1.1rem; font-weight: bold; }
    .hearts { position: fixed; inset: 0; pointer-events: none; }
    .hearts span { position: absolute; font-size: 24px; opacity: .28; animation: float 6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-20px) rotate(180deg); } }
    @media (max-width: 480px) { .login-container { padding: 34px 24px; } }
  </style>
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span style="left:10%;top:15%;animation-delay:0s">&#9829;</span>
    <span style="left:24%;top:70%;animation-delay:1s">&#9829;</span>
    <span style="left:72%;top:20%;animation-delay:2s">&#9829;</span>
    <span style="left:87%;top:76%;animation-delay:3s">&#9829;</span>
  </div>

  <main class="login-container">
    <h1 class="logo">Tinaska's Diary</h1>
    <p class="subtitle">Our private love story</p>
    <div id="message" class="message" role="alert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="Password" required>
      </div>
      <button type="submit" class="login-btn">Enter our diary</button>
    </form>

    <p class="access-note">Sign in with your email and password.</p>
    <div class="couple-names"><span>Albert</span><span>Tinah</span></div>
  </main>

  <script type="module">
    import { auth } from './app-core.js';
    import { onAuthStateChanged, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js';

    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');
    const submitButton = form.querySelector('button');
    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      submitButton.disabled = true;
      submitButton.textContent = 'Signing in...';
      try {
        await signInWithEmailAndPassword(auth, form.loginEmail.value.trim(), form.loginPassword.value);
        showMessage('Welcome back to our love story.', 'success');
      } catch (error) {
        const friendly = error.code === 'auth/invalid-email' ? 'Please enter a valid email address.' : 'Invalid email or password.';
        showMessage(friendly, 'error');
        submitButton.disabled = false;
        submitButton.textContent = 'Enter our diary';
      }
    });

    // Firebase Authentication alone controls access here. No Firestore setup
    // document or member UID configuration is required to sign in.
    onAuthStateChanged(auth, user => {
      if (user) window.location.href = 'diary.html';
    });
  </script>
</body>
</html>
