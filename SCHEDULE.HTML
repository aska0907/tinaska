<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Plans & Goals</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Patrick Hand', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        /* Navigation */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Dancing Script', cursive;
            font-size: 2em;
            font-weight: bold;
            color: #764ba2;
        }

        .logo span {
            color: #ff6b6b;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
            font-family: 'Patrick Hand', cursive;
        }

        .nav-links a:hover, .nav-links a.active {
            background: #764ba2;
            color: white;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 10px auto 20px;
            padding: 20px;
        }

        /* Header */
        .plans-header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .plans-header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Add Plan Button */
        .add-plan-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff6b6b, #764ba2);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 2em;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .add-plan-btn:hover {
            transform: scale(1.1) rotate(90deg);
        }

        /* Plans Layout */
        .plans-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 768px) {
            .plans-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Plan Categories */
        .plan-category {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #e0e0e0;
        }

        .category-icon {
            font-size: 2em;
        }

        .category-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2em;
            color: #764ba2;
        }

        .category-stats {
            margin-left: auto;
            background: #f8f9ff;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            color: #764ba2;
        }

        /* Plans List */
        .plans-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }

        /* Plan Item */
        .plan-item {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 20px;
            border-left: 4px solid #764ba2;
            transition: all 0.3s ease;
            position: relative;
        }

        .plan-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .plan-item.completed {
            opacity: 0.7;
            background: #f0f8f0;
            border-left-color: #4CAF50;
        }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .plan-title {
            font-weight: bold;
            font-size: 1.2em;
            color: #333;
            margin-bottom: 5px;
        }

        .plan-date {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .plan-description {
            color: #555;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .plan-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #e0e0e0;
        }

        .plan-author {
            font-weight: bold;
            font-size: 0.9em;
        }

        .plan-author.albert {
            color: #667eea;
        }

        .plan-author.tinah {
            color: #ff6b6b;
        }

        .plan-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .approval-status {
            display: flex;
            gap: 5px;
        }

        .approval-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ddd;
        }

        .approval-dot.approved {
            background: #4CAF50;
        }

        .approval-dot.pending {
            background: #FFC107;
        }

        /* Action Buttons */
        .plan-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s ease;
            font-family: 'Patrick Hand', cursive;
        }

        .approve-btn {
            background: #4CAF50;
            color: white;
        }

        .complete-btn {
            background: #2196F3;
            color: white;
        }

        .delete-btn {
            background: #f44336;
            color: white;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Completion Checkbox */
        .completion-check {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkmark {
            width: 20px;
            height: 20px;
            border: 2px solid #ddd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .checkmark.checked {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5em;
            cursor: pointer;
            color: #888;
        }

        .close-modal:hover {
            color: #333;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #764ba2;
            font-family: 'Dancing Script', cursive;
            font-size: 1.3em;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            font-family: 'Patrick Hand', cursive;
            transition: border-color 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #764ba2;
            background: white;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b6b, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Patrick Hand', cursive;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8em;
            margin-bottom: 10px;
            color: #764ba2;
        }

        /* Floating Hearts */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-hearts span {
            position: absolute;
            font-size: 20px;
            opacity: 0.2;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
    </style>
</head>
<body>
  <script src="navbar.js"></script>

    <!-- Main Content -->
    <div class="container">
        <div class="plans-header">
            <h1>Our Plans & Goals 🎯</h1>
            <p>Let's plan our beautiful future together</p>
        </div>

        <div class="plans-layout">
            <!-- Upcoming Plans -->
            <div class="plan-category">
                <div class="category-header">
                    <div class="category-icon">📅</div>
                    <div class="category-title">Upcoming Plans</div>
                    <div class="category-stats" id="upcomingStats">0 plans</div>
                </div>
                <div class="plans-list" id="upcomingPlans">
                    <!-- Upcoming plans will be added here -->
                    <div class="empty-state">
                        <h3>No upcoming plans</h3>
                        <p>Click + to schedule something fun!</p>
                    </div>
                </div>
            </div>

            <!-- Completed Goals -->
            <div class="plan-category">
                <div class="category-header">
                    <div class="category-icon">✅</div>
                    <div class="category-title">Completed Goals</div>
                    <div class="category-stats" id="completedStats">0 goals</div>
                </div>
                <div class="plans-list" id="completedPlans">
                    <!-- Completed plans will be added here -->
                    <div class="empty-state">
                        <h3>No completed goals yet</h3>
                        <p>Complete your first plan together! 💕</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Plan Button -->
    <button class="add-plan-btn" onclick="openPlanModal()">+</button>

    <!-- Add Plan Modal -->
    <div class="modal" id="planModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closePlanModal()">×</span>
            <h2 style="font-family: 'Dancing Script', cursive; color: #764ba2; margin-bottom: 20px; text-align: center;">Create New Plan</h2>
            
            <form id="planForm">
                <div class="form-group">
                    <label for="planTitle">Plan Title</label>
                    <input type="text" id="planTitle" placeholder="What do you want to do together?" required>
                </div>

                <div class="form-group">
                    <label for="planDate">When?</label>
                    <input type="date" id="planDate" required>
                </div>

                <div class="form-group">
                    <label for="planCategory">Category</label>
                    <select id="planCategory" required>
                        <option value="date">💕 Romantic Date</option>
                        <option value="travel">✈️ Travel</option>
                        <option value="goal">🎯 Personal Goal</option>
                        <option value="fun">🎉 Fun Activity</option>
                        <option value="home">🏠 Home Project</option>
                        <option value="other">🌟 Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="planDescription">Description</label>
                    <textarea id="planDescription" placeholder="Tell us about this plan... 💖"></textarea>
                </div>

                <div class="form-group">
                    <label>Created by</label>
                    <div style="display: flex; gap: 10px;">
                        <label style="display: flex; align-items: center; gap: 5px;">
                            <input type="radio" name="author" value="Albert" checked> Albert
                        </label>
                        <label style="display: flex; align-items: center; gap: 5px;">
                            <input type="radio" name="author" value="Tinah"> Tinah
                        </label>
                    </div>
                </div>

                <button type="submit" class="submit-btn">💾 Create Plan</button>
            </form>
        </div>
    </div>

    <!-- Floating Hearts -->
    <div class="floating-hearts">
        <span style="left:10%; animation-delay:0s;">💖</span>
        <span style="left:20%; animation-delay:1s;">💕</span>
        <span style="left:30%; animation-delay:2s;">❤️</span>
        <span style="left:40%; animation-delay:3s;">💗</span>
        <span style="left:60%; animation-delay:4s;">💓</span>
        <span style="left:80%; animation-delay:5s;">💝</span>
    </div>
<script type="module">
    import { firebaseConfig } from './firebase-config.js';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';
    import { 
        getFirestore, 
        collection, 
        addDoc, 
        getDocs, 
        query, 
        orderBy,
        onSnapshot,
        updateDoc,
        deleteDoc,
        doc,
        serverTimestamp 
    } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';
    import { 
        getAuth, 
        onAuthStateChanged 
    } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let allPlans = [];
    let currentUser = null;
    let currentUserName = null;

    // Check authentication
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            
            // Wait for user data to be fully loaded
            await user.reload();
            
            // Get the displayName - handle null case
            currentUserName = user.displayName ? user.displayName : null;
            
            console.log('🔥 User logged in:', {
                email: user.email,
                displayName: user.displayName,
                currentUserName: currentUserName
            });
            
            // If displayName is still null, use fallback
            if (!currentUserName) {
                console.warn('⚠️ displayName is null, using email fallback');
                currentUserName = user.email ? (user.email.toLowerCase().includes('albert') ? 'Albert' : 'Tinah') : 'Unknown';
                console.log('🔄 Using fallback username:', currentUserName);
            }
            
            loadPlans();
            setupRealtimeUpdates();
        } else {
            window.location.href = 'index.html';
        }
    });

    async function loadPlans() {
        try {
            const q = query(
                collection(db, 'couplePlans'),
                orderBy('createdAt', 'desc')
            );
            
            const querySnapshot = await getDocs(q);
            allPlans = querySnapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            
            console.log('📝 Loaded plans:', allPlans);
            updatePlansDisplay();
        } catch (error) {
            console.error("Error loading plans: ", error);
        }
    }

    function setupRealtimeUpdates() {
        const q = query(
            collection(db, 'couplePlans'),
            orderBy('createdAt', 'desc')
        );
        
        onSnapshot(q, (snapshot) => {
            allPlans = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            updatePlansDisplay();
        });
    }

    // Modal Functions
    function openPlanModal() {
        document.getElementById('planModal').style.display = 'block';
        document.getElementById('planDate').valueAsDate = new Date();
    }

    function closePlanModal() {
        document.getElementById('planModal').style.display = 'none';
        document.getElementById('planForm').reset();
    }

    // Form Submission
    document.getElementById('planForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = this.querySelector('.submit-btn');
        submitBtn.textContent = 'Creating...';
        submitBtn.disabled = true;

        try {
            const author = document.querySelector('input[name="author"]:checked').value;
            
            const planData = {
                title: document.getElementById('planTitle').value,
                date: document.getElementById('planDate').value,
                category: document.getElementById('planCategory').value,
                description: document.getElementById('planDescription').value,
                author: author,
                approved: { 
                    albert: author === 'Albert', // Auto-approve for creator
                    tinah: author === 'Tinah'    // Auto-approve for creator
                },
                completed: false,
                createdAt: serverTimestamp()
            };

            await addDoc(collection(db, 'couplePlans'), planData);
            
            closePlanModal();
            alert('Plan created successfully! 💕');
            
        } catch (error) {
            console.error("Error creating plan: ", error);
            alert('Error creating plan. Please try again.');
        } finally {
            submitBtn.textContent = '💾 Create Plan';
            submitBtn.disabled = false;
        }
    });

    // Update Plans Display
    function updatePlansDisplay() {
        console.log('🔄 Updating plans display...');
        console.log('👤 Current user name:', currentUserName);
        
        const upcomingContainer = document.getElementById('upcomingPlans');
        const completedContainer = document.getElementById('completedPlans');
        
        const upcomingPlans = allPlans.filter(plan => !plan.completed);
        const completedPlans = allPlans.filter(plan => plan.completed);
        
        // Update stats
        document.getElementById('upcomingStats').textContent = `${upcomingPlans.length} plans`;
        document.getElementById('completedStats').textContent = `${completedPlans.length} goals`;
        
        // Display upcoming plans
        if (upcomingPlans.length === 0) {
            upcomingContainer.innerHTML = `
                <div class="empty-state">
                    <h3>No upcoming plans</h3>
                    <p>Click + to schedule something fun!</p>
                </div>
            `;
        } else {
            upcomingContainer.innerHTML = upcomingPlans.map(plan => createPlanHTML(plan)).join('');
        }
        
        // Display completed plans
        if (completedPlans.length === 0) {
            completedContainer.innerHTML = `
                <div class="empty-state">
                    <h3>No completed goals yet</h3>
                    <p>Complete your first plan together! 💕</p>
                </div>
            `;
        } else {
            completedContainer.innerHTML = completedPlans.map(plan => createPlanHTML(plan)).join('');
        }
    }

    // Create Plan HTML
    function createPlanHTML(plan) {
        const formattedDate = new Date(plan.date).toLocaleDateString('en-US', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
        
        const categoryIcons = {
            date: '💕',
            travel: '✈️',
            goal: '🎯',
            fun: '🎉',
            home: '🏠',
            other: '🌟'
        };
        
        const isFullyApproved = plan.approved.albert && plan.approved.tinah;
        
        // Debug logging for approval logic
        console.log(`🔍 Checking plan: "${plan.title}"`);
        console.log(`   - Author: ${plan.author}`);
        console.log(`   - Current user: ${currentUserName}`);
        console.log(`   - Albert approved: ${plan.approved.albert}`);
        console.log(`   - Tinah approved: ${plan.approved.tinah}`);
        
        // Determine which approval buttons to show based on current user
        const showAlbertApprove = currentUserName === 'Albert' && !plan.approved.albert && plan.author !== 'Albert';
        const showTinahApprove = currentUserName === 'Tinah' && !plan.approved.tinah && plan.author !== 'Tinah';
        
        console.log(`   - Show Albert approve: ${showAlbertApprove}`);
        console.log(`   - Show Tinah approve: ${showTinahApprove}`);
        
        return `
            <div class="plan-item ${plan.completed ? 'completed' : ''}" data-id="${plan.id}">
                <div class="plan-header">
                    <div>
                        <div class="plan-title">${categoryIcons[plan.category]} ${plan.title}</div>
                        <div class="plan-date">${formattedDate}</div>
                    </div>
                    <div class="completion-check" onclick="toggleCompletion('${plan.id}')">
                        <div class="checkmark ${plan.completed ? 'checked' : ''}">
                            ${plan.completed ? '✓' : ''}
                        </div>
                        <span>Done</span>
                    </div>
                </div>
                
                <div class="plan-description">${plan.description}</div>
                
                <div class="plan-meta">
                    <div class="plan-author ${plan.author.toLowerCase()}">By ${plan.author}</div>
                    <div class="plan-status">
                        <div class="approval-status">
                            <div class="approval-dot ${plan.approved.albert ? 'approved' : 'pending'}" title="${plan.approved.albert ? 'Albert approved' : 'Albert pending'}"></div>
                            <div class="approval-dot ${plan.approved.tinah ? 'approved' : 'pending'}" title="${plan.approved.tinah ? 'Tinah approved' : 'Tinah pending'}"></div>
                        </div>
                    </div>
                </div>
                
                ${!plan.completed ? `
                <div class="plan-actions">
                    ${showAlbertApprove ? `
                    <button class="action-btn approve-btn" onclick="approvePlan('${plan.id}', 'albert')">
                        Albert Approve
                    </button>
                    ` : ''}
                    
                    ${showTinahApprove ? `
                    <button class="action-btn approve-btn" onclick="approvePlan('${plan.id}', 'tinah')">
                        Tinah Approve
                    </button>
                    ` : ''}
                    
                    ${(showAlbertApprove || showTinahApprove) ? `
                    <button class="action-btn delete-btn" onclick="deletePlan('${plan.id}')">Delete</button>
                    ` : ''}
                    
                    ${!showAlbertApprove && !showTinahApprove ? `
                    <div style="color: #666; font-size: 0.9em;">
                        ${isFullyApproved ? '✅ Both approved!' : 'Waiting for partner approval...'}
                    </div>
                    ` : ''}
                </div>
                ` : ''}
            </div>
        `;
    }

    // Plan Actions
    async function toggleCompletion(planId) {
        try {
            const plan = allPlans.find(p => p.id === planId);
            if (plan) {
                const planRef = doc(db, 'couplePlans', planId);
                await updateDoc(planRef, {
                    completed: !plan.completed
                });
            }
        } catch (error) {
            console.error("Error updating plan completion: ", error);
            alert('Error updating plan. Please try again.');
        }
    }

    async function approvePlan(planId, user) {
        try {
            const plan = allPlans.find(p => p.id === planId);
            if (plan && !plan.approved[user]) {
                const planRef = doc(db, 'couplePlans', planId);
                const updatedApproval = {
                    ...plan.approved,
                    [user]: true
                };
                
                await updateDoc(planRef, {
                    approved: updatedApproval
                });

                if (updatedApproval.albert && updatedApproval.tinah) {
                    alert('🎉 Both approved! Plan is confirmed!');
                }
            }
        } catch (error) {
            console.error("Error approving plan: ", error);
            alert('Error approving plan. Please try again.');
        }
    }

    async function deletePlan(planId) {
        if (confirm('Are you sure you want to delete this plan?')) {
            try {
                const planRef = doc(db, 'couplePlans', planId);
                await deleteDoc(planRef);
            } catch (error) {
                console.error("Error deleting plan: ", error);
                alert('Error deleting plan. Please try again.');
            }
        }
    }

    // Close modal when clicking outside
    window.addEventListener('click', function(e) {
        const modal = document.getElementById('planModal');
        if (e.target === modal) {
            closePlanModal();
        }
    });

    // Make functions available globally
    window.openPlanModal = openPlanModal;
    window.closePlanModal = closePlanModal;
    window.toggleCompletion = toggleCompletion;
    window.approvePlan = approvePlan;
    window.deletePlan = deletePlan;
</script>
</body>
</html>
