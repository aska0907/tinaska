<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Letters - Our Heartfelt Messages</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Patrick Hand', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        /* Navigation */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Dancing Script', cursive;
            font-size: 2em;
            font-weight: bold;
            color: #764ba2;
        }

        .logo span {
            color: #ff6b6b;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.3s ease;
            font-family: 'Patrick Hand', cursive;
        }

        .nav-links a:hover, .nav-links a.active {
            background: #764ba2;
            color: white;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 10px auto 20px;
            padding: 20px;
        }

        /* Header */
        .letters-header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        .letters-header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .letters-header p {
            font-size: 1.3em;
            opacity: 0.9;
        }

        /* Filter Tabs */
        .letter-tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Patrick Hand', cursive;
            font-size: 1.1em;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        /* Write Letter Button */
        .write-letter-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff6b6b, #764ba2);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 2em;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .write-letter-btn:hover {
            transform: scale(1.1) rotate(90deg);
        }

        /* Letters Grid */
        .letters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 768px) {
            .letters-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Letter Card */
        .letter-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            position: relative;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            min-height: 300px;
            display: flex;
            flex-direction: column;
        }

        .letter-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .letter-card.albert {
            border-color: #667eea;
            background: linear-gradient(135deg, #ffffff 0%, #f0f4ff 100%);
        }

        .letter-card.tinah {
            border-color: #ff6b6b;
            background: linear-gradient(135deg, #ffffff 0%, #fff0f0 100%);
        }

        .letter-card.scheduled {
            opacity: 0.7;
            border-style: dashed;
        }

        .scheduled-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #FFC107;
            color: #333;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .letter-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #e0e0e0;
            position: relative;
        }

        .letter-author {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8em;
            font-weight: bold;
        }

        .letter-author.albert {
            color: #667eea;
        }

        .letter-author.tinah {
            color: #ff6b6b;
        }

        .letter-date {
            color: #666;
            font-size: 0.9em;
            text-align: right;
        }

        .letter-title {
            font-family: 'Dancing Script', cursive;
            font-size: 1.5em;
            color: #764ba2;
            margin-bottom: 15px;
            text-align: center;
        }

        .letter-content {
            flex: 1;
            line-height: 1.6;
            font-size: 1.1em;
            color: #555;
            overflow: hidden;
            position: relative;
        }

        .letter-content.expandable {
            max-height: 150px;
            cursor: pointer;
        }

        .letter-content.expandable::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: linear-gradient(transparent, white);
            pointer-events: none;
        }

        .letter-content.expanded {
            max-height: none;
        }

        .letter-content.expanded::after {
            display: none;
        }

        .read-more {
            color: #764ba2;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .letter-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .letter-mood {
            font-size: 1.5em;
        }

        .letter-seal {
            font-family: 'Dancing Script', cursive;
            font-style: italic;
            color: #666;
        }

        /* Edit Icon - Subtle and only on hover */
        .edit-icon {
            position: absolute;
            top: 5px;
            right: 5px;
            opacity: 0;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 1.2em;
            color: #764ba2;
            background: none;
            border: none;
            padding: 5px;
            border-radius: 50%;
        }

        .letter-card:hover .edit-icon {
            opacity: 1;
        }

        .edit-icon:hover {
            background: rgba(118, 75, 162, 0.1);
            transform: scale(1.1);
        }

        /* Inline Edit Form */
        .edit-form {
            display: none;
            margin-top: 15px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 15px;
            border: 1px dashed #764ba2;
        }

        .edit-form input, .edit-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Patrick Hand', cursive;
            font-size: 1em;
        }

        .edit-form textarea {
            height: 120px;
            resize: vertical;
        }

        .edit-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .save-btn, .cancel-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Patrick Hand', cursive;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .save-btn {
            background-color: #667eea;
            color: white;
        }

        .save-btn:hover {
            background-color: #5a6fd8;
        }

        .cancel-btn {
            background-color: #ff6b6b;
            color: white;
        }

        .cancel-btn:hover {
            background-color: #ff5252;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5em;
            cursor: pointer;
            color: #888;
        }

        .close-modal:hover {
            color: #333;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #764ba2;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5em;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 1.1em;
            font-family: 'Patrick Hand', cursive;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #764ba2;
            background: white;
        }

        .form-group textarea {
            height: 200px;
            resize: vertical;
            line-height: 1.6;
        }

        .author-selection {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .author-option {
            flex: 1;
            padding: 15px;
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Patrick Hand', cursive;
            font-size: 1.1em;
            font-weight: bold;
        }

        .author-option.active {
            border-color: #764ba2;
            background: #764ba2;
            color: white;
        }

        .author-option.albert.active {
            background: #667eea;
            border-color: #667eea;
        }

        .author-option.tinah.active {
            background: #ff6b6b;
            border-color: #ff6b6b;
        }

        .mood-options {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .mood-btn {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 1.3em;
        }

        .mood-btn.active {
            border-color: #764ba2;
            background: #764ba2;
            color: white;
        }

        .schedule-option {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ff6b6b, #764ba2);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Patrick Hand', cursive;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: white;
            grid-column: 1 / -1;
        }

        .empty-state h3 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .empty-state p {
            font-size: 1.2em;
            opacity: 0.8;
        }

        /* Floating Hearts */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-hearts span {
            position: absolute;
            font-size: 20px;
            opacity: 0.2;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .letters-header h1 {
                font-size: 2.8em;
            }
            
            .letter-card {
                padding: 20px;
            }
            
            .letters-grid {
                grid-template-columns: 1fr;
            }
            
            .mood-options {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
   <script src="navbar.js"></script>
    <!-- Main Content -->
    <div class="container">
        <div class="letters-header">
            <h1>Our Love Letters 💌</h1>
            <p>Heartfelt messages that last forever</p>
        </div>

        <!-- Filter Tabs -->
        <div class="letter-tabs">
            <button class="tab-btn active" onclick="filterLetters('all')">All Letters</button>
            <button class="tab-btn" onclick="filterLetters('available')">Available Now</button>
            <button class="tab-btn" onclick="filterLetters('scheduled')">Scheduled</button>
        </div>

        <div class="letters-grid" id="lettersGrid">
            <!-- Letters will be dynamically added here -->
            <div class="empty-state">
                <h3>No love letters yet</h3>
                <p>Write your first love letter to create a beautiful keepsake!</p>
            </div>
        </div>
    </div>

    <!-- Write Letter Button -->
    <button class="write-letter-btn" onclick="openLetterModal()">✏️</button>

    <!-- Write Letter Modal -->
    <div class="modal" id="letterModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeLetterModal()">×</span>
            <h2 style="font-family: 'Dancing Script', cursive; color: #764ba2; margin-bottom: 30px; text-align: center; font-size: 2.5em;">Write a Love Letter</h2>
            
            <form id="letterForm">
                <div class="author-selection">
                    <div class="author-option albert active" onclick="selectAuthor('albert')">
                        💙 Albert Writes
                    </div>
                    <div class="author-option tinah" onclick="selectAuthor('tinah')">
                        💖 Tinah Writes
                    </div>
                </div>

                <div class="form-group">
                    <label for="letterTitle">Letter Title</label>
                    <input type="text" id="letterTitle" placeholder="My Heart for You... 💕" required>
                </div>

                <div class="form-group">
                    <label for="letterDate">Letter Date</label>
                    <input type="date" id="letterDate" required>
                </div>

                <div class="form-group">
                    <label>How are you feeling?</label>
                    <div class="mood-options">
                        <div class="mood-btn active" data-mood="😊">😊</div>
                        <div class="mood-btn" data-mood="😍">😍</div>
                        <div class="mood-btn" data-mood="🥰">🥰</div>
                        <div class="mood-btn" data-mood="😢">😢</div>
                        <div class="mood-btn" data-mood="🤗">🤗</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="letterContent">Your Love Letter</label>
                    <textarea id="letterContent" placeholder="My dearest love... 

Write from your heart everything you feel. This letter will be a permanent keepsake of your love.

With all my love," required></textarea>
                </div>

                <div class="form-group">
                    <label>Schedule this letter?</label>
                    <div class="schedule-option">
                        <input type="checkbox" id="scheduleLetter" onchange="toggleScheduleDate()">
                        <label for="scheduleLetter">Make this letter available only after a specific date</label>
                    </div>
                    <input type="date" id="availableDate" style="display: none; margin-top: 10px;" placeholder="When should this letter become available?">
                </div>

                <button type="submit" class="submit-btn">✉️ Send This Love Letter</button>
            </form>
        </div>
    </div>

    <!-- Floating Hearts -->
    <div class="floating-hearts">
        <span style="left:10%; animation-delay:0s;">💖</span>
        <span style="left:20%; animation-delay:1s;">💕</span>
        <span style="left:30%; animation-delay:2s;">❤️</span>
        <span style="left:40%; animation-delay:3s;">💗</span>
        <span style="left:60%; animation-delay:4s;">💓</span>
        <span style="left:80%; animation-delay:5s;">💝</span>
    </div>
<script type="module">
    import { firebaseConfig } from './firebase-config.js';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js';
    import { 
        getFirestore, 
        collection, 
        addDoc, 
        getDocs, 
        query, 
        orderBy,
        onSnapshot,
        serverTimestamp,
        updateDoc,
        doc
    } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';
    import { 
        getAuth, 
        onAuthStateChanged 
    } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentAuthor = 'albert';
    let currentMood = '😊';
    let currentUser = null;
    let currentUserName = null;
    let allLetters = [];
    let currentFilter = 'all';

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            
            // Wait for user data to be fully loaded
            await user.reload();
            
            // Get the displayName - it should be set from registration
            currentUserName = user.displayName ? user.displayName.toLowerCase() : null;
            
            console.log('🔥 User logged in:', {
                email: user.email,
                displayName: user.displayName,
                currentUserName: currentUserName
            });
            
            // If displayName is still null, we need to handle this
            if (!currentUserName) {
                console.warn('⚠️ displayName is null, trying to get from email or other method');
                // Try to get from email or set a default
                currentUserName = user.email ? user.email.toLowerCase().includes('albert') ? 'albert' : 'tinah' : 'unknown';
                console.log('🔄 Using fallback username:', currentUserName);
            }
            
            loadLetters();
            setupRealtimeUpdates();
        } else {
            window.location.href = 'index.html';
        }
    });

    async function loadLetters() {
        try {
            const q = query(
                collection(db, 'loveLetters'),
                orderBy('createdAt', 'desc')
            );
            
            const querySnapshot = await getDocs(q);
            allLetters = querySnapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            
            console.log('📝 Loaded letters:', allLetters);
            updateLettersGrid();
        } catch (error) {
            console.error("Error loading letters: ", error);
        }
    }

    function setupRealtimeUpdates() {
        const q = query(
            collection(db, 'loveLetters'),
            orderBy('createdAt', 'desc')
        );
        
        onSnapshot(q, (snapshot) => {
            allLetters = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            updateLettersGrid();
        });
    }

    function openLetterModal() {
        document.getElementById('letterModal').style.display = 'block';
        document.getElementById('letterDate').valueAsDate = new Date();
        document.getElementById('availableDate').valueAsDate = new Date();
    }

    function closeLetterModal() {
        document.getElementById('letterModal').style.display = 'none';
        document.getElementById('letterForm').reset();
        selectAuthor('albert');
        document.querySelector('.mood-btn').click();
        document.getElementById('scheduleLetter').checked = false;
        document.getElementById('availableDate').style.display = 'none';
    }

    function selectAuthor(author) {
        currentAuthor = author;
        document.querySelectorAll('.author-option').forEach(opt => {
            opt.classList.remove('active');
        });
        document.querySelector(`.author-option.${author}`).classList.add('active');
    }

    function toggleScheduleDate() {
        const scheduleCheckbox = document.getElementById('scheduleLetter');
        const availableDateInput = document.getElementById('availableDate');
        availableDateInput.style.display = scheduleCheckbox.checked ? 'block' : 'none';
        if (scheduleCheckbox.checked) {
            const nextMonth = new Date();
            nextMonth.setMonth(nextMonth.getMonth() + 1);
            availableDateInput.valueAsDate = nextMonth;
        }
    }

    document.querySelectorAll('.mood-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentMood = this.dataset.mood;
        });
    });

    document.getElementById('letterForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = this.querySelector('.submit-btn');
        submitBtn.textContent = 'Saving...';
        submitBtn.disabled = true;

        try {
            const scheduleCheckbox = document.getElementById('scheduleLetter');
            const availableDate = scheduleCheckbox.checked ? document.getElementById('availableDate').value : null;
            const isScheduled = scheduleCheckbox.checked;

            // Use currentUserName which should now be properly set
            if (!currentUserName) {
                alert('Error: Could not determine your user identity. Please refresh the page.');
                return;
            }

            const letterData = {
                author: currentUserName, // Use the actual logged-in user's name
                title: document.getElementById('letterTitle').value,
                date: document.getElementById('letterDate').value,
                mood: currentMood,
                content: document.getElementById('letterContent').value,
                isScheduled: isScheduled,
                availableDate: availableDate,
                createdAt: serverTimestamp()
            };

            console.log('💾 Saving letter:', letterData);
            await addDoc(collection(db, 'loveLetters'), letterData);
            
            closeLetterModal();
            alert('💌 Your love letter has been saved forever!');
            
        } catch (error) {
            console.error("Error saving letter: ", error);
            alert('Error saving letter. Please try again.');
        } finally {
            submitBtn.textContent = '✉️ Send This Love Letter';
            submitBtn.disabled = false;
        }
    });

    function filterLetters(filter) {
        currentFilter = filter;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        updateLettersGrid();
    }

    // Inline Edit Functions
    function enableEditMode(letterId) {
        // Hide the display content
        const displayContent = document.getElementById(`display-${letterId}`);
        displayContent.style.display = 'none';
        
        // Show the edit form
        const editForm = document.getElementById(`edit-${letterId}`);
        editForm.style.display = 'block';
    }

    function cancelEdit(letterId) {
        // Show the display content
        const displayContent = document.getElementById(`display-${letterId}`);
        displayContent.style.display = 'block';
        
        // Hide the edit form
        const editForm = document.getElementById(`edit-${letterId}`);
        editForm.style.display = 'none';
    }

    async function saveEdit(letterId) {
        const editTitle = document.getElementById(`edit-title-${letterId}`).value;
        const editContent = document.getElementById(`edit-content-${letterId}`).value;

        if (!editTitle || !editContent) {
            alert('Please fill in all fields');
            return;
        }

        try {
            const letterData = {
                title: editTitle,
                content: editContent,
                updatedAt: serverTimestamp()
            };

            await updateDoc(doc(db, 'loveLetters', letterId), letterData);
            
            // Hide the edit form and show display content
            cancelEdit(letterId);
            alert('Love letter updated successfully! 💕');
            
        } catch (error) {
            console.error("Error updating love letter: ", error);
            alert('Error updating letter. Please try again.');
        }
    }

    function updateLettersGrid() {
        console.log('🔄 Updating letters grid...');
        console.log('👤 Current user:', currentUserName);
        console.log('📋 Current filter:', currentFilter);
        
        const container = document.getElementById('lettersGrid');
        
        let filteredLetters = allLetters;
        const today = new Date().toISOString().split('T')[0];
        
        // If currentUserName is still null, show a warning
        if (!currentUserName) {
            console.error('❌ currentUserName is still null!');
            container.innerHTML = `
                <div class="empty-state">
                    <h3>Authentication Error</h3>
                    <p>Please refresh the page or log in again.</p>
                </div>
            `;
            return;
        }

        // Filter logic based on current tab
        if (currentFilter === 'all') {
            filteredLetters = allLetters.filter(letter => {
                if (!letter.isScheduled) return true;
                if (letter.availableDate && letter.availableDate <= today) return true;
                console.log(`📬 Scheduled letter visible to author: ${letter.title}, author: ${letter.author}, current user: ${currentUserName}`);
                return letter.author === currentUserName;
            });
        } else if (currentFilter === 'available') {
            filteredLetters = allLetters.filter(letter => 
                !letter.isScheduled || (letter.availableDate && letter.availableDate <= today)
            );
        } else if (currentFilter === 'scheduled') {
            filteredLetters = allLetters.filter(letter => {
                if (!letter.isScheduled) return false;
                if (letter.availableDate && letter.availableDate <= today) return false;
                console.log(`⏰ Scheduled letter visible to author: ${letter.title}, author: ${letter.author}, current user: ${currentUserName}`);
                return letter.author === currentUserName;
            });
        }
        
        console.log('✅ Filtered letters:', filteredLetters);
        
        if (filteredLetters.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>No love letters found</h3>
                    <p>${allLetters.length === 0 ? 'Write your first love letter!' : 'No letters match your current filter'}</p>
                </div>
            `;
            return;
        }

        container.innerHTML = filteredLetters.map(letter => {
            const formattedDate = new Date(letter.date).toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            const isLong = letter.content.length > 300;
            const displayContent = isLong ? letter.content.substring(0, 300) + '...' : letter.content;
            
            const isAvailable = !letter.isScheduled || (letter.availableDate && letter.availableDate <= today);
            const isMyLetter = letter.author === currentUserName;
            const isScheduledHidden = letter.isScheduled && !isAvailable && !isMyLetter;

            console.log(`📄 Rendering letter: ${letter.title}, isMyLetter: ${isMyLetter}, isScheduledHidden: ${isScheduledHidden}`);

            if (isScheduledHidden) return '';

            return `
                <div class="letter-card ${letter.author} ${letter.isScheduled && !isAvailable ? 'scheduled' : ''}">
                    ${letter.isScheduled && !isAvailable ? `
                        <div class="scheduled-badge">
                            📅 Available ${new Date(letter.availableDate).toLocaleDateString()}
                        </div>
                    ` : ''}
                    
                    <div class="letter-header">
                        <div class="letter-author ${letter.author}">
                            ${letter.author === 'albert' ? '💙 Albert' : '💖 Tinah'}
                        </div>
                        <div class="letter-date">${formattedDate}</div>
                        ${isMyLetter ? `
                            <button class="edit-icon" onclick="enableEditMode('${letter.id}')">✏️</button>
                        ` : ''}
                    </div>
                    
                    <!-- Display Content -->
                    <div id="display-${letter.id}">
                        <div class="letter-title">${letter.title}</div>
                        
                        <div class="letter-content ${isLong ? 'expandable' : ''}" 
                             onclick="${isLong ? `toggleExpand('${letter.id}')` : ''}" 
                             id="content-${letter.id}">
                            ${displayContent}
                        </div>
                        
                        ${isLong ? `
                            <div class="read-more" onclick="toggleExpand('${letter.id}')">
                                Read full letter...
                            </div>
                        ` : ''}
                        
                        <div class="letter-footer">
                            <div class="letter-mood">${letter.mood}</div>
                            <div class="letter-seal">Forever yours</div>
                        </div>
                    </div>
                    
                    <!-- Edit Form (only for my letters) -->
                    ${isMyLetter ? `
                        <div class="edit-form" id="edit-${letter.id}">
                            <input type="text" id="edit-title-${letter.id}" value="${letter.title}" placeholder="Letter Title">
                            <textarea id="edit-content-${letter.id}" placeholder="Your love letter...">${letter.content}</textarea>
                            <div class="edit-actions">
                                <button class="cancel-btn" onclick="cancelEdit('${letter.id}')">Cancel</button>
                                <button class="save-btn" onclick="saveEdit('${letter.id}')">Save</button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('').replace(/\n\s*\n/g, '\n');
    }

    function toggleExpand(letterId) {
        const contentElement = document.getElementById(`content-${letterId}`);
        const letter = allLetters.find(l => l.id === letterId);
        
        if (!letter) return;
        
        if (contentElement.classList.contains('expanded')) {
            contentElement.classList.remove('expanded');
            contentElement.textContent = letter.content.substring(0, 300) + '...';
            if (contentElement.nextElementSibling) {
                contentElement.nextElementSibling.textContent = 'Read full letter...';
            }
        } else {
            contentElement.classList.add('expanded');
            contentElement.textContent = letter.content;
            if (contentElement.nextElementSibling) {
                contentElement.nextElementSibling.textContent = 'Show less';
            }
        }
    }

    window.addEventListener('click', function(e) {
        const modal = document.getElementById('letterModal');
        if (e.target === modal) {
            closeLetterModal();
        }
    });

    window.openLetterModal = openLetterModal;
    window.closeLetterModal = closeLetterModal;
    window.selectAuthor = selectAuthor;
    window.toggleScheduleDate = toggleScheduleDate;
    window.filterLetters = filterLetters;
    window.toggleExpand = toggleExpand;
    window.enableEditMode = enableEditMode;
    window.cancelEdit = cancelEdit;
    window.saveEdit = saveEdit;
</script>
</body>
</html>
