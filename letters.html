<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Letters</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; } body { min-height:100vh; margin:0; color:#332b3b; font-family:'Patrick Hand',cursive; background:linear-gradient(135deg,#667eea,#764ba2); } button,input,select { font:inherit; }
    .page { width:min(1180px,100%); margin:0 auto; padding:24px 20px 70px; } header { color:#fff; text-align:center; } h1 { margin:6px 0 5px; font:700 clamp(3rem,9vw,4.4rem) 'Dancing Script',cursive; text-shadow:2px 2px 4px rgba(0,0,0,.25); } header p { font-size:1.18rem; }
    .controls { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center; margin:30px 0 20px; padding:16px; border-radius:18px; background:rgba(255,255,255,.96); box-shadow:0 8px 24px rgba(0,0,0,.15); } .search { width:100%; min-width:0; padding:11px 13px; border:2px solid #ddd; border-radius:10px; } .filter-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; } .filter-btn,.sort-select,.action-btn { padding:9px 12px; border:0; border-radius:10px; cursor:pointer; } .filter-btn { color:#664a85; background:#efe9f6; } .filter-btn.active { color:#fff; background:#764ba2; } .sort-select { border:2px solid #ded4ea; background:#fff; }
    .letters-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr)); gap:20px; } .letter { display:flex; flex-direction:column; min-height:270px; padding:23px; border:2px solid rgba(118,75,162,.15); border-radius:18px; background:#fffdf9; box-shadow:0 8px 22px rgba(0,0,0,.12); } .letter-top { display:flex; gap:10px; justify-content:space-between; color:#755981; } .letter-author { color:#764ba2; font-weight:bold; } .letter h2 { margin:12px 0 9px; color:#764ba2; font:700 2rem 'Dancing Script',cursive; overflow-wrap:anywhere; } .letter-content { flex:1; line-height:1.55; overflow-wrap:anywhere; } .letter-content p { margin:.5em 0; } .letter-content ul,.letter-content ol { padding-left:22px; } .letter-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; } .action-btn { color:#fff; background:#764ba2; } .action-btn.delete { background:#b42318; } .empty { grid-column:1/-1; padding:55px 20px; color:#fff; text-align:center; } .empty h2 { margin:0; font:700 2.5rem 'Dancing Script',cursive; }
    .add { position:fixed; right:30px; bottom:30px; width:60px; height:60px; border:0; border-radius:50%; cursor:pointer; color:#fff; font-size:2rem; background:linear-gradient(135deg,#ff6b6b,#764ba2); box-shadow:0 5px 20px rgba(0,0,0,.25); }
    .modal { display:none; position:fixed; inset:0; z-index:2000; padding:16px; background:rgba(0,0,0,.55); overflow:auto; } .modal.open { display:grid; place-items:center; } .dialog { width:min(100%,760px); margin:auto; padding:28px; border-radius:20px; background:#fff; box-shadow:0 12px 40px rgba(0,0,0,.3); } .dialog-head { display:flex; align-items:center; justify-content:space-between; gap:15px; } .dialog h2 { margin:0 0 16px; color:#764ba2; font:700 2.4rem 'Dancing Script',cursive; } .close { border:0; cursor:pointer; color:#666; background:none; font-size:2rem; } .field { margin:15px 0; } label { display:block; margin-bottom:6px; color:#764ba2; font-weight:bold; } input[type=text],input[type=date] { width:100%; padding:11px; border:2px solid #ded4ea; border-radius:10px; } .editor-toolbar { display:flex; flex-wrap:wrap; gap:7px; padding:8px; border:2px solid #ded4ea; border-bottom:0; border-radius:10px 10px 0 0; background:#f8f4fc; } .editor-toolbar button { min-width:34px; padding:6px 9px; border:0; border-radius:7px; cursor:pointer; color:#593a70; background:#fff; } .editor { min-height:260px; padding:15px; border:2px solid #ded4ea; border-radius:0 0 10px 10px; outline:none; line-height:1.55; overflow-wrap:anywhere; } .editor:focus { border-color:#764ba2; } .draft-note { color:#666; font-size:.9rem; } .submit { width:100%; margin-top:18px; padding:14px; border:0; border-radius:10px; cursor:pointer; color:#fff; font-size:1.1rem; background:linear-gradient(135deg,#ff6b6b,#764ba2); } .submit:disabled { opacity:.7; cursor:wait; }
    @media(max-width:700px) { .controls { grid-template-columns:1fr; } .dialog { padding:22px 16px; } .add { right:18px; bottom:20px; } }
  </style>
</head>
<body>
  <script src="navbar.js"></script>
  <main class="page">
    <header><h1>Love Letters</h1><p>Words worth keeping forever.</p></header>
    <section class="controls" aria-label="Letter controls">
      <input id="search" class="search" type="search" placeholder="Search letters by a word or phrase">
      <div class="filter-row">
        <button class="filter-btn active" type="button" data-filter="all">All</button><button class="filter-btn" type="button" data-filter="day">Today</button><button class="filter-btn" type="button" data-filter="month">This month</button><button class="filter-btn" type="button" data-filter="year">This year</button>
        <select id="sort" class="sort-select" aria-label="Sort letters"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select>
      </div>
    </section>
    <section id="letters" class="letters-grid" aria-live="polite"></section>
  </main>
  <button id="addLetter" class="add" type="button" aria-label="Write a letter">+</button>

  <div id="letterModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="letterModalTitle">
    <form id="letterForm" class="dialog">
      <div class="dialog-head"><h2 id="letterModalTitle">Write a Love Letter</h2><button id="closeModal" class="close" type="button" aria-label="Close">&times;</button></div>
      <div class="field"><label for="letterTitle">Title</label><input id="letterTitle" type="text" maxlength="120" required placeholder="My heart for you..."></div>
      <div class="field"><label for="letterDate">Letter date</label><input id="letterDate" type="date" required></div>
      <div class="field"><label for="letterContent">Your letter</label><div class="editor-toolbar" aria-label="Text formatting"><button type="button" data-command="bold" title="Bold"><b>B</b></button><button type="button" data-command="italic" title="Italic"><i>I</i></button><button type="button" data-command="underline" title="Underline"><u>U</u></button><button type="button" data-command="insertUnorderedList" title="Bullet list">List</button><button type="button" data-emoji="&#x1F495;" title="Insert heart">Heart</button></div><div id="letterContent" class="editor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Write from your heart..."></div></div>
      <p id="draftNote" class="draft-note">Drafts save automatically on this device.</p>
      <button id="saveLetter" class="submit" type="submit">Save Letter</button>
    </form>
  </div>

  <script type="module">
    import { auth, assertCoupleMember, db, escapeHtml, memberName, sanitizeRichText, showToast } from './app-core.js';
    import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js';
    import { addDoc, collection, deleteDoc, doc, onSnapshot, serverTimestamp, updateDoc } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';

    // Existing letters are stored in the top-level loveLetters collection.
    // Keep this path in sync with Firestore: collection name casing matters.
    const lettersRef = collection(db, 'loveLetters');
    const container = document.getElementById('letters');
    const modal = document.getElementById('letterModal');
    const form = document.getElementById('letterForm');
    const titleInput = document.getElementById('letterTitle');
    const dateInput = document.getElementById('letterDate');
    const editor = document.getElementById('letterContent');
    const saveButton = document.getElementById('saveLetter');
    const modalTitle = document.getElementById('letterModalTitle');
    const draftKey = 'tinaska:letter-draft:v2';
    let items = [], currentUser, couple, editingId = null, currentFilter = 'all';

    const dateValue = () => { const now = new Date(); return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0,10); };
    const storedDateValue = value => {
      if (typeof value === 'string') return value.slice(0, 10);
      if (value?.toDate) return value.toDate().toISOString().slice(0, 10);
      if (value instanceof Date) return value.toISOString().slice(0, 10);
      return '';
    };
    const normalizeLetter = snapshot => {
      const data = snapshot.data();
      const availableDate = storedDateValue(data.availableDate || data.date || data.createdAt);
      return {
        id: snapshot.id,
        ...data,
        // Support the established loveLetters schema as well as letters
        // created by this page before the collection-path correction.
        authorName: data.authorName || data.author || 'Partner',
        date: availableDate,
        availableDate,
        isScheduled: Boolean(data.isScheduled)
      };
    };
    const plainText = value => { const holder = document.createElement('div'); holder.innerHTML = sanitizeRichText(value); return holder.textContent || ''; };
    const dateMatches = value => { if (!value) return currentFilter === 'all'; if (currentFilter === 'all') return true; const today = new Date(); const date = new Date(`${value}T00:00:00`); if (currentFilter === 'day') return value === dateValue(); if (currentFilter === 'month') return date.getFullYear() === today.getFullYear() && date.getMonth() === today.getMonth(); return date.getFullYear() === today.getFullYear(); };

    function render() {
      const query = document.getElementById('search').value.trim().toLowerCase();
      const order = document.getElementById('sort').value === 'newest' ? -1 : 1;
      const visible = items.filter(item => (!item.isScheduled || !item.availableDate || item.availableDate <= dateValue()) && dateMatches(item.date) && (!query || `${item.title} ${plainText(item.content)}`.toLowerCase().includes(query))).sort((a,b) => order * (a.date || '').localeCompare(b.date || ''));
      if (!visible.length) { container.innerHTML = '<div class="empty"><h2>No letters found</h2><p>Try another filter or write a new letter.</p></div>'; return; }
      container.innerHTML = visible.map(item => `<article class="letter" data-id="${item.id}"><div class="letter-top"><span class="letter-author">${escapeHtml(item.authorName || 'Partner')}</span><time datetime="${item.date}">${new Date(`${item.date}T00:00:00`).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</time></div><h2>${escapeHtml(item.title)}</h2><div class="letter-content">${sanitizeRichText(item.content || '')}</div><div class="letter-actions"><button type="button" class="action-btn" data-action="edit">Edit</button><button type="button" class="action-btn delete" data-action="delete">Delete</button></div></article>`).join('');
    }

    function saveDraft() { if (editingId) return; localStorage.setItem(draftKey, JSON.stringify({ title:titleInput.value, date:dateInput.value, content:editor.innerHTML })); }
    function restoreDraft() { try { const draft = JSON.parse(localStorage.getItem(draftKey)); if (draft?.title || draft?.content) { titleInput.value = draft.title || ''; dateInput.value = draft.date || dateValue(); editor.innerHTML = sanitizeRichText(draft.content || ''); document.getElementById('draftNote').textContent = 'Restored your unsent draft from this device.'; } } catch { localStorage.removeItem(draftKey); } }
    function openModal(item) { editingId = item?.id || null; form.reset(); editor.innerHTML = ''; dateInput.value = dateValue(); if (item) { modalTitle.textContent = 'Edit Love Letter'; titleInput.value = item.title || ''; dateInput.value = item.date; editor.innerHTML = sanitizeRichText(item.content || ''); document.getElementById('draftNote').textContent = 'Changes save for both of you.'; } else { modalTitle.textContent = 'Write a Love Letter'; document.getElementById('draftNote').textContent = 'Drafts save automatically on this device.'; restoreDraft(); } saveButton.textContent = item ? 'Save Changes' : 'Save Letter'; modal.classList.add('open'); titleInput.focus(); }
    function closeModal() { modal.classList.remove('open'); editingId = null; form.reset(); editor.innerHTML = ''; }

    document.getElementById('addLetter').addEventListener('click', () => openModal()); document.getElementById('closeModal').addEventListener('click', closeModal); modal.addEventListener('click', e => { if (e.target === modal) closeModal(); }); document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    document.querySelectorAll('.filter-btn').forEach(button => button.addEventListener('click', () => { currentFilter = button.dataset.filter; document.querySelectorAll('.filter-btn').forEach(item => item.classList.toggle('active', item === button)); render(); })); document.getElementById('search').addEventListener('input', render); document.getElementById('sort').addEventListener('change', render);
    [titleInput,dateInput,editor].forEach(element => element.addEventListener('input', saveDraft));
    document.querySelectorAll('.editor-toolbar button').forEach(button => button.addEventListener('click', () => { editor.focus(); if (button.dataset.emoji) document.execCommand('insertText', false, button.dataset.emoji); else document.execCommand(button.dataset.command, false); saveDraft(); }));

    container.addEventListener('click', async event => { const button = event.target.closest('[data-action]'); if (!button) return; const item = items.find(letter => letter.id === button.closest('[data-id]')?.dataset.id); if (!item) return; if (button.dataset.action === 'edit') openModal(item); if (button.dataset.action === 'delete') { if (!confirm('Delete this letter permanently?')) return; try { await deleteDoc(doc(lettersRef,item.id)); showToast('Letter deleted.'); } catch (error) { console.error(error); showToast('Could not delete the letter.', 'error'); } } });
    form.addEventListener('submit', async event => { event.preventDefault(); const content = sanitizeRichText(editor.innerHTML); if (!titleInput.value.trim() || !plainText(content).trim()) { showToast('Please add a title and letter content.', 'error'); return; } const author = memberName(couple,currentUser); const data = { title:titleInput.value.trim(), date:dateInput.value, availableDate:dateInput.value, content, author, authorName:author, updatedAt:serverTimestamp() }; saveButton.disabled = true; try { if (editingId) { await updateDoc(doc(lettersRef,editingId),data); showToast('Letter updated for both of you.'); } else { await addDoc(lettersRef,{...data,authorId:currentUser.uid,isScheduled:false,createdAt:serverTimestamp()}); localStorage.removeItem(draftKey); showToast('Love letter saved.'); } closeModal(); } catch(error) { console.error(error); showToast('Could not save the letter.', 'error'); } finally { saveButton.disabled=false; } });
    onAuthStateChanged(auth, async user => { if (!user) { location.href='index.html'; return; } currentUser=user; try { couple=await assertCoupleMember(user); onSnapshot(lettersRef,snapshot => { items=snapshot.docs.map(normalizeLetter); render(); },error => { console.error(error); showToast('Could not load letters.','error'); }); } catch(error) { await signOut(auth); location.href='index.html'; } });
  </script>
</body>
</html>
