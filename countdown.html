<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Special Countdowns</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; color: #333; font-family: 'Patrick Hand', cursive; background: linear-gradient(135deg, #667eea, #764ba2); }
    button, input, textarea { font: inherit; }
    .container { width: min(1200px, 100%); margin: 10px auto 20px; padding: 20px; }
    .countdown-header { margin-bottom: 38px; color: #fff; text-align: center; }
    .countdown-header h1 { margin-bottom: 8px; font: 700 clamp(2.8rem, 8vw, 3.5rem) 'Dancing Script', cursive; text-shadow: 2px 2px 4px rgba(0,0,0,.3); }
    .countdown-header p { font-size: 1.15rem; }
    .days-since-card { position: relative; overflow: hidden; margin-bottom: 30px; padding: 30px; border: 3px solid rgba(255,255,255,.3); border-radius: 20px; color: #fff; text-align: center; background: linear-gradient(135deg, #ff6b6b, #764ba2); box-shadow: 0 8px 25px rgba(0,0,0,.2); }
    .days-since-title { margin-bottom: 10px; font: 700 2.5rem 'Dancing Script', cursive; }
    .days-since-date { margin-bottom: 25px; font-size: 1.15rem; opacity: .9; }
    .time-since-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; }
    .time-since-unit { padding: 15px 10px; border: 2px solid rgba(255,255,255,.3); border-radius: 15px; background: rgba(255,255,255,.18); }
    .time-since-number { display: block; font: 700 1.9rem 'Dancing Script', cursive; }
    .time-since-label { display: block; margin-top: 5px; font-size: .8rem; letter-spacing: 1px; text-transform: uppercase; }
    .days-since-message { margin-top: 20px; font-style: italic; }
    .section-heading { margin: 34px 0 16px; color: #fff; font: 700 2rem 'Dancing Script', cursive; }
    .countdowns-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 25px; margin-bottom: 40px; }
    .countdown-card { padding: 27px; border: 3px solid transparent; border-radius: 20px; background: #fff; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,.12); transition: transform .2s, box-shadow .2s; }
    .countdown-card:hover { transform: translateY(-4px); box-shadow: 0 15px 35px rgba(0,0,0,.2); }
    .countdown-card.anniversary { border-color: #ff6b6b; background: linear-gradient(135deg, #fff, #fff0f0); }
    .countdown-card.birthday { border-color: #667eea; background: linear-gradient(135deg, #fff, #f0f4ff); }
    .countdown-card.vacation { border-color: #4caf50; background: linear-gradient(135deg, #fff, #f0fff0); }
    .countdown-card.special { border-color: #ffc107; background: linear-gradient(135deg, #fff, #fffbf0); }
    .countdown-card.expired { opacity: .9; filter: saturate(.7); }
    .countdown-title { margin-bottom: 10px; color: #764ba2; font: 700 2rem 'Dancing Script', cursive; overflow-wrap: anywhere; }
    .countdown-date { margin-bottom: 17px; color: #666; font-size: 1.05rem; }
    .countdown-timer { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 18px 0; }
    .time-unit { min-width: 0; padding: 13px 6px; border: 2px solid rgba(118,75,162,.2); border-radius: 14px; background: rgba(118,75,162,.1); }
    .time-number { display: block; color: #764ba2; font-size: clamp(1.35rem, 5vw, 1.8rem); font-weight: bold; }
    .time-label { color: #666; font-size: .72rem; text-transform: uppercase; }
    .days-until { display: inline-block; margin-top: 6px; padding: 8px 14px; border-radius: 20px; color: #fff; font-weight: bold; background: #764ba2; }
    .countdown-message { margin-top: 15px; color: #666; font-style: italic; overflow-wrap: anywhere; }
    .countdown-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; }
    .card-btn { padding: 8px 12px; border: 0; border-radius: 10px; cursor: pointer; color: #fff; background: #764ba2; }
    .card-btn.restart { background: #207b53; }
    .card-btn.delete { background: #b42318; }
    .add-countdown-btn { position: fixed; right: 30px; bottom: 30px; z-index: 100; width: 60px; height: 60px; border: 0; border-radius: 50%; cursor: pointer; color: #fff; font-size: 2rem; background: linear-gradient(135deg, #ff6b6b, #764ba2); box-shadow: 0 4px 20px rgba(0,0,0,.25); transition: transform .2s; }
    .add-countdown-btn:hover { transform: scale(1.08) rotate(90deg); }
    .empty-state { grid-column: 1 / -1; padding: 56px 20px; color: #fff; text-align: center; }
    .empty-state h2 { margin-bottom: 10px; font: 700 2.4rem 'Dancing Script', cursive; }
    .modal { display: none; position: fixed; inset: 0; z-index: 2000; padding: 18px; background: rgba(0,0,0,.52); backdrop-filter: blur(5px); overflow-y: auto; }
    .modal.open { display: grid; place-items: center; }
    .modal-content { position: relative; width: min(100%, 530px); margin: auto; padding: 30px; border-radius: 20px; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
    .modal-content h2 { margin-bottom: 22px; color: #764ba2; text-align: center; font: 700 2.2rem 'Dancing Script', cursive; }
    .close-modal { position: absolute; top: 12px; right: 18px; border: 0; cursor: pointer; color: #666; background: transparent; font-size: 2rem; line-height: 1; }
    .form-group { margin-bottom: 18px; text-align: left; }
    .form-group label { display: block; margin-bottom: 7px; color: #764ba2; font: 700 1.28rem 'Dancing Script', cursive; }
    .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; resize: vertical; }
    .form-group textarea { min-height: 105px; line-height: 1.4; }
    .category-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
    .category-btn { padding: 11px 8px; border: 2px solid #e0e0e0; border-radius: 10px; cursor: pointer; background: #fff; }
    .category-btn.active { border-color: #764ba2; color: #fff; background: #764ba2; }
    .submit-btn { width: 100%; padding: 15px; border: 0; border-radius: 10px; cursor: pointer; color: #fff; font-size: 1.15rem; background: linear-gradient(135deg, #ff6b6b, #764ba2); }
    .submit-btn:disabled { cursor: wait; opacity: .7; }
    @media (max-width: 600px) { .container { padding: 16px; } .days-since-card, .countdown-card { padding: 22px 16px; } .add-countdown-btn { right: 18px; bottom: 20px; } .modal-content { padding: 28px 18px; } }
  </style>
</head>
<body>
  <script src="navbar.js"></script>
  <main class="container">
    <header class="countdown-header">
      <h1>Our Special Countdowns</h1>
      <p>Counting down to our beautiful moments together</p>
    </header>

    <section class="days-since-card" aria-labelledby="together-title">
      <h2 id="together-title" class="days-since-title">Time Since We Started Dating</h2>
      <p class="days-since-date">Since 4 September 2025</p>
      <div class="time-since-grid">
        <div class="time-since-unit"><span id="yearsSince" class="time-since-number">0</span><span class="time-since-label">Years</span></div>
        <div class="time-since-unit"><span id="monthsSince" class="time-since-number">0</span><span class="time-since-label">Months</span></div>
        <div class="time-since-unit"><span id="weeksSince" class="time-since-number">0</span><span class="time-since-label">Weeks</span></div>
        <div class="time-since-unit"><span id="daysSince" class="time-since-number">0</span><span class="time-since-label">Days</span></div>
        <div class="time-since-unit"><span id="hoursSince" class="time-since-number">0</span><span class="time-since-label">Hours</span></div>
      </div>
      <p class="days-since-message">Every moment with you is precious.</p>
    </section>

    <section aria-labelledby="active-heading">
      <h2 id="active-heading" class="section-heading">Upcoming</h2>
      <div id="activeCountdowns" class="countdowns-grid"></div>
    </section>
    <section id="historySection" hidden aria-labelledby="history-heading">
      <h2 id="history-heading" class="section-heading">Countdown History</h2>
      <div id="expiredCountdowns" class="countdowns-grid"></div>
    </section>
  </main>

  <button id="addCountdown" class="add-countdown-btn" type="button" aria-label="Add a countdown">+</button>

  <div id="countdownModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <button id="closeModal" class="close-modal" type="button" aria-label="Close">&times;</button>
      <h2 id="modalTitle">Add Countdown</h2>
      <form id="countdownForm">
        <div class="form-group">
          <label for="countdownTitle">What are we counting down to?</label>
          <input id="countdownTitle" maxlength="100" placeholder="Our anniversary, birthday, vacation..." required>
        </div>
        <div class="form-group">
          <label for="countdownDate">When is it?</label>
          <input id="countdownDate" type="date" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <div class="category-options" role="group" aria-label="Countdown category">
            <button class="category-btn active" type="button" data-category="anniversary">Anniversary</button>
            <button class="category-btn" type="button" data-category="birthday">Birthday</button>
            <button class="category-btn" type="button" data-category="vacation">Vacation</button>
            <button class="category-btn" type="button" data-category="special">Special Day</button>
          </div>
        </div>
        <div class="form-group">
          <label for="countdownMessage">Special message <small>(optional)</small></label>
          <textarea id="countdownMessage" maxlength="1000" placeholder="Why is this day special?"></textarea>
        </div>
        <button id="saveCountdown" type="submit" class="submit-btn">Start Countdown</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, assertCoupleMember, coupleCollection, escapeHtml, showToast } from './app-core.js';
    import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js';
    import { addDoc, deleteDoc, doc, onSnapshot, orderBy, query, serverTimestamp, updateDoc } from 'https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js';

    const countdownsRef = coupleCollection('countdowns');
    const activeContainer = document.getElementById('activeCountdowns');
    const expiredContainer = document.getElementById('expiredCountdowns');
    const historySection = document.getElementById('historySection');
    const modal = document.getElementById('countdownModal');
    const form = document.getElementById('countdownForm');
    const saveButton = document.getElementById('saveCountdown');
    const modalTitle = document.getElementById('modalTitle');
    const dateInput = document.getElementById('countdownDate');
    const titleInput = document.getElementById('countdownTitle');
    const messageInput = document.getElementById('countdownMessage');

    let countdowns = [];
    let currentUser = null;
    let selectedCategory = 'anniversary';
    let editingId = null;
    let timerId = null;
    let unsubscribe = null;

    function localDateString(date = new Date()) {
      const offset = date.getTimezoneOffset() * 60000;
      return new Date(date.getTime() - offset).toISOString().slice(0, 10);
    }

    function parseDate(value, endOfDay = false) {
      return new Date(`${value}T${endOfDay ? '23:59:59.999' : '00:00:00'}`);
    }

    function isExpired(countdown) {
      return parseDate(countdown.targetDate, true).getTime() < Date.now();
    }

    function formatDate(value) {
      return parseDate(value).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    function setCategory(category) {
      selectedCategory = category;
      document.querySelectorAll('.category-btn').forEach(button => {
        button.classList.toggle('active', button.dataset.category === category);
      });
    }

    function openModal(countdown = null, restart = false) {
      editingId = countdown && !restart ? countdown.id : null;
      form.reset();
      if (countdown) {
        titleInput.value = countdown.title || '';
        messageInput.value = countdown.message || '';
        dateInput.value = restart ? localDateString() : countdown.targetDate;
        setCategory(countdown.category || 'special');
      } else {
        dateInput.value = localDateString();
        setCategory('anniversary');
      }
      modalTitle.textContent = editingId ? 'Edit Countdown' : restart ? 'Restart Countdown' : 'Add Countdown';
      saveButton.textContent = editingId ? 'Save Changes' : restart ? 'Restart Countdown' : 'Start Countdown';
      modal.classList.add('open');
      titleInput.focus();
    }

    function closeModal() {
      modal.classList.remove('open');
      editingId = null;
      form.reset();
    }

    function createCard(countdown, expired) {
      const target = parseDate(countdown.targetDate, true);
      const difference = target.getTime() - Date.now();
      const days = Math.max(0, Math.floor(difference / 86400000));
      const title = escapeHtml(countdown.title);
      const message = countdown.message ? `<p class="countdown-message">&ldquo;${escapeHtml(countdown.message)}&rdquo;</p>` : '';
      const status = expired ? `Completed on ${formatDate(countdown.targetDate)}` : days === 0 ? 'Today!' : days === 1 ? 'Tomorrow!' : `${days} days to go`;
      return `
        <article class="countdown-card ${escapeHtml(countdown.category || 'special')} ${expired ? 'expired' : ''}" data-countdown-id="${countdown.id}">
          <h3 class="countdown-title">${title}</h3>
          <p class="countdown-date">${formatDate(countdown.targetDate)}</p>
          <div class="countdown-timer" aria-label="Time remaining">
            <div class="time-unit"><span class="time-number" data-time="days">0</span><span class="time-label">Days</span></div>
            <div class="time-unit"><span class="time-number" data-time="hours">0</span><span class="time-label">Hours</span></div>
            <div class="time-unit"><span class="time-number" data-time="minutes">0</span><span class="time-label">Minutes</span></div>
            <div class="time-unit"><span class="time-number" data-time="seconds">0</span><span class="time-label">Seconds</span></div>
          </div>
          <p class="days-until">${status}</p>
          ${message}
          <div class="countdown-actions">
            <button type="button" class="card-btn" data-action="edit">Edit</button>
            ${expired ? '<button type="button" class="card-btn restart" data-action="restart">Restart</button>' : ''}
            <button type="button" class="card-btn delete" data-action="delete">Delete</button>
          </div>
        </article>`;
    }

    function renderCountdowns() {
      const active = countdowns.filter(item => !isExpired(item));
      const expired = countdowns.filter(isExpired);
      activeContainer.innerHTML = active.length ? active.map(item => createCard(item, false)).join('') : '<div class="empty-state"><h2>No upcoming countdowns</h2><p>Add a special date to start counting down together.</p></div>';
      expiredContainer.innerHTML = expired.map(item => createCard(item, true)).join('');
      historySection.hidden = expired.length === 0;
      updateCountdownTimers();
    }

    function updateCountdownTimers() {
      document.querySelectorAll('[data-countdown-id]').forEach(card => {
        const countdown = countdowns.find(item => item.id === card.dataset.countdownId);
        if (!countdown) return;
        let remaining = Math.max(0, parseDate(countdown.targetDate, true).getTime() - Date.now());
        const values = {
          days: Math.floor(remaining / 86400000),
          hours: Math.floor((remaining % 86400000) / 3600000),
          minutes: Math.floor((remaining % 3600000) / 60000),
          seconds: Math.floor((remaining % 60000) / 1000)
        };
        Object.entries(values).forEach(([name, value]) => {
          const element = card.querySelector(`[data-time="${name}"]`);
          if (element) element.textContent = value;
        });
      });
    }

    function updateTimeTogether() {
      const started = new Date('2025-09-04T00:00:00');
      const now = new Date();
      const totalHours = Math.max(0, Math.floor((now - started) / 3600000));
      const totalDays = Math.floor(totalHours / 24);
      let years = now.getFullYear() - started.getFullYear();
      let months = now.getMonth() - started.getMonth();
      if (now.getDate() < started.getDate()) months--;
      if (months < 0) { years--; months += 12; }
      document.getElementById('yearsSince').textContent = Math.max(0, years);
      document.getElementById('monthsSince').textContent = Math.max(0, months);
      document.getElementById('weeksSince').textContent = Math.floor(totalDays / 7);
      document.getElementById('daysSince').textContent = totalDays;
      document.getElementById('hoursSince').textContent = totalHours;
    }

    async function removeCountdown(id) {
      if (!window.confirm('Delete this countdown permanently?')) return;
      try {
        await deleteDoc(doc(countdownsRef, id));
        showToast('Countdown deleted.');
      } catch (error) {
        console.error(error);
        showToast('Could not delete the countdown. Please try again.', 'error');
      }
    }

    activeContainer.addEventListener('click', handleCardAction);
    expiredContainer.addEventListener('click', handleCardAction);
    function handleCardAction(event) {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const card = button.closest('[data-countdown-id]');
      const countdown = countdowns.find(item => item.id === card?.dataset.countdownId);
      if (!countdown) return;
      if (button.dataset.action === 'edit') openModal(countdown);
      if (button.dataset.action === 'restart') openModal(countdown, true);
      if (button.dataset.action === 'delete') removeCountdown(countdown.id);
    }

    document.getElementById('addCountdown').addEventListener('click', () => openModal());
    document.getElementById('closeModal').addEventListener('click', closeModal);
    modal.addEventListener('click', event => { if (event.target === modal) closeModal(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
    document.querySelectorAll('.category-btn').forEach(button => button.addEventListener('click', () => setCategory(button.dataset.category)));

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const payload = {
        title: titleInput.value.trim(),
        targetDate: dateInput.value,
        category: selectedCategory,
        message: messageInput.value.trim(),
        updatedAt: serverTimestamp()
      };
      if (!payload.title || !payload.targetDate) return;
      saveButton.disabled = true;
      const originalText = saveButton.textContent;
      saveButton.textContent = editingId ? 'Saving...' : 'Creating...';
      try {
        if (editingId) {
          await updateDoc(doc(countdownsRef, editingId), payload);
          showToast('Countdown updated for both of you.');
        } else {
          await addDoc(countdownsRef, { ...payload, createdBy: currentUser.uid, createdAt: serverTimestamp() });
          showToast('Shared countdown created.');
        }
        closeModal();
      } catch (error) {
        console.error(error);
        showToast('Could not save the countdown. Please try again.', 'error');
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = originalText;
      }
    });

    onAuthStateChanged(auth, async user => {
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;
      try {
        await assertCoupleMember(user);
        unsubscribe?.();
        unsubscribe = onSnapshot(query(countdownsRef, orderBy('targetDate', 'asc')), snapshot => {
          countdowns = snapshot.docs.map(item => ({ id: item.id, ...item.data() }));
          renderCountdowns();
        }, error => {
          console.error(error);
          showToast('Could not load countdowns.', 'error');
        });
      } catch (error) {
        console.error(error);
        await signOut(auth);
        window.location.href = 'index.html';
      }
    });

    updateTimeTogether();
    timerId = window.setInterval(() => { updateTimeTogether(); updateCountdownTimers(); }, 1000);
    window.addEventListener('beforeunload', () => { window.clearInterval(timerId); unsubscribe?.(); });
  </script>
</body>
</html>
